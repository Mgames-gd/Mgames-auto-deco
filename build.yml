name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - name: Verify .geode (must be a zip with mod.json + Android binaries)
        run: |
          set -e
          ls -la "${{ steps.combine.outputs.build-output }}"
          for f in "${{ steps.combine.outputs.build-output }}"/*.geode; do
            echo "== $f"; unzip -l "$f"
            unzip -l "$f" | grep -q "mod.json"
            unzip -l "$f" | grep -qi "android"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.combine.outputs.build-output }}
      # Publish the RAW .geode on the Releases page, so it can be downloaded
      # directly (artifacts are always wrapped into a .zip by GitHub).
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "${{ steps.combine.outputs.build-output }}"/*.geode \
            --repo "${{ github.repository }}" \
            --title "Mgames Auto Deco build ${{ github.run_number }}" \
            --notes "Raw .geode file. Put it into Android/media/com.geode.launcher/game/geode/mods/"
